[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "groovemap-catalog-api"
version = "0.1.1"
description = "Authentication, catalog search, graph queries, recommendations, and operator APIs for GrooveMap"
authors = [{name = "Robert Wlodarczyk", email = "robert@simplicityguy.com"}]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
license = "AGPL-3.0-only"
license-files = [
    "COMMERCIAL-LICENSING.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
]
dependencies = [
    "anthropic>=1.0.0",
    "cryptography>=50.0.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "groovemap-agent-tools==0.1.0",
    "groovemap-runtime[neo4j,otel,otel-http,postgres]==0.1.0",
    "httpx>=0.28.1",
    "neo4j-rust-ext>=6.2.0.0",
    "orjson>=3.12.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pyotp>=2.10.0",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=8.1.0",
    "slowapi>=0.1.10",
    "sse-starlette>=3.4.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
catalog-api = "api.api:main"
catalog-setup = "api.setup:main"
catalog-admin-setup = "api.admin_setup:main"
catalog-media-backfill = "api.media_backfill:main"

[project.urls]
Homepage = "https://groovemap.music"
Repository = "https://github.com/groovemap-music/catalog-api"
Issues = "https://github.com/groovemap-music/catalog-api/issues"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "commitizen>=4.18.0",
    "cyclonedx-bom>=7.3.1",
    "fakeredis>=2.37.1",
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.4",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.uv]
exclude-newer = "2 days"

[tool.uv.sources]
groovemap-runtime = { git = "https://github.com/groovemap-music/python-libraries.git", rev = "455523ec388fdb9862d7aca65d9434aa7073dcb5" }
groovemap-agent-tools = { git = "https://github.com/groovemap-music/python-libraries.git", subdirectory = "agent-tools", rev = "455523ec388fdb9862d7aca65d9434aa7073dcb5" }

[tool.ruff]
extend-exclude = [
    "api/catalog_contract.py",
    "api/contracts/internal-insights/v1/python/catalog_api_contract.py",
    "contracts/catalog-events/v1/discogs/python/catalog_contract.py",
    "contracts/catalog-events/v1/musicbrainz/python/catalog_contract.py",
    "docs/superpowers",
]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "PLC", "PTH", "RUF", "S", "SIM", "T20", "TCH", "UP", "W"]
ignore = [
    "B008",
    "C901",
    "E501",
    "S101",
    # FastAPI and Pydantic resolve annotations at runtime. Keep their names importable.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["api"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"api/api.py" = ["T201"]
"api/admin_setup.py" = ["T201"]
"api/setup.py" = ["T201"]
"api/media_backfill.py" = ["T201"]
"scripts/*.py" = ["S108", "T201"]
"performance/*.py" = ["PLC0415", "T201"]
"tests/**/*.py" = ["PLC", "S105", "T201"]
"api/queries/search_queries.py" = ["S608"]
"api/queries/metrics_queries.py" = ["S608"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
packages = ["api"]

[[tool.mypy.overrides]]
module = ["neo4j.*", "slowapi.*", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
markers = [
    "benchmark: performance regression benchmarks",
    "e2e: end-to-end tests requiring external services",
    "integration: tests requiring a live backing service",
]

[tool.coverage.run]
source = ["api"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
version_files = ["api/__init__.py:__version__"]
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
