name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@833cb464507678c38ab78bd4718ce697399463e9
    with:
      repository-name: catalog-api
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: |
        dist/*.whl
        dist/*.tar.gz
        dist/provenance.json
      artifact-variant: primary
      publish-image: true
      prepare-image-command: just prepare-private-wheels

  release-performance:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@833cb464507678c38ab78bd4718ce697399463e9
    with:
      repository-name: catalog-api
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: |
        dist/*.whl
        dist/*.tar.gz
        dist/provenance.json
      artifact-variant: performance
      publish-image: true
      image-variant: performance
      dockerfile: performance/Dockerfile
      prepare-image-command: just prepare-private-wheels
